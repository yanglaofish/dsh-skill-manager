# 把 @yanglaofish/dsh-skill-manager 发布到 npmjs（GitHub Actions）。
#
# 为什么走 CI：公司出口的 SWG 会按 URL 关键词拦上传，GitHub runner 不在公司网内，
# 完全绕开该限制（dsh-proxy-pro 的 LESSONS §32）。同时 CI 里才有淘宝源的主动同步。
#
# 发布流程（人）：
#   1. 改完代码，`npm test` 全绿；
#   2. `npm version <X.Y.Z> --no-git-tag-version`（或手改 package.json）；
#   3. `git commit -am "release: X.Y.Z"`；
#   4. `git tag vX.Y.Z && git push origin master --tags` → 本 workflow 跑在 v* tag 上。
#   版本号约定见 docs/VERSIONING.md（插件大版本 = dsh 代际）。
#
# 认证（二选一，与 dsh-proxy-pro 一致）：
#   A) 仓库 secret `NPM`（名字任意，workflow 读 secrets.NPM）：
#      npmjs → Access Tokens → Granular，Read+Publish（仅本包）→ 存为仓库 secret NPM。
#   B) OIDC trusted publishing：npmjs 包设置 → "Trusted publishers"
#      → 关联 yanglaofish/dsh-skill-manager（需要下面的 id-token 权限）。
name: Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing（方式 B）/ provenance
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 单测需要 adm-zip + yaml，所以必须装依赖。
      # --legacy-peer-deps：peerDependencies 里的 @deepseek-ai/dsh-* 是"运行时世代声明"
      # （dsh 由宿主提供，profile 从不安装它们），让 npm 去 registry 解析并下载这些 peer
      # 既没必要、也会让 CI 依赖它们在上游可解析。只装 dependencies 就够了。
      # 用 `npm install` 而非 `npm ci`：本仓库刻意不提交 lockfile（package-lock.json
      # 在 .gitignore 里），`npm ci` 在缺少 lockfile 的检出上会硬失败。
      - name: Install dependencies (unit tests need adm-zip + yaml)
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # 把"走了哪条认证路径"写成 annotation：step 日志要登录才能看，而认证路径是
      # 排查发布失败的第一信息（`::notice::` 用公开 API 就能读到）。
      - name: Configure npm auth (NPM if set, else OIDC)
        shell: bash
        env:
          NPM_TOKEN_FROM_SECRET: ${{ secrets.NPM }}
        run: |
          if [ -n "$NPM_TOKEN_FROM_SECRET" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_FROM_SECRET}" > "$HOME/.npmrc"
            echo "::notice title=npm auth::using repository secret NPM (token length ${#NPM_TOKEN_FROM_SECRET})"
          else
            echo "::notice title=npm auth::repository secret NPM is NOT set — falling back to OIDC trusted publishing, which requires npmjs Trusted Publishers to be configured for this repository"
          fi

      - name: Syntax check
        run: node --check lib/index.js && node --check lib/client.js

      # 单测必须两端都能跑：开发在 Windows，runner 是 Linux。失败时把尾部输出写成
      # `::error::` annotation —— step 日志要登录 GitHub 才能下载，而 annotation 通过
      # 公开 API 就能读（/check-runs/{id}/annotations），这样"CI 红了但看不到原因"
      # 不会再发生第二次。
      - name: Unit tests
        shell: bash
        run: |
          STATUS=0
          node test/unit.mjs > /tmp/unit.log 2>&1 || STATUS=$?
          if [ "$STATUS" != "0" ]; then
            node -e '
              const fs = require("node:fs");
              let text = "";
              try { text = fs.readFileSync("/tmp/unit.log", "utf8") } catch {}
              const lines = String(text).split("\n");
              const bad = lines.filter((l) => /❌|Error|error|throw|not ok/.test(l));
              const tail = (bad.length ? bad : lines).slice(-40).join("\n");
              console.log("::error title=unit tests failed on the runner::" + tail.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A"));
            '
            echo "--- last 40 lines of node test/unit.mjs ---"
            tail -40 /tmp/unit.log
            exit 1
          fi
          tail -3 /tmp/unit.log
          # 清单级世代护栏是 2.x 才有的：1.3.5 是 dsh 0.1 世代的收尾重编号版，
          # 那时还不存在这个文件。条件执行让两个 tag 都能跑。
          if [ -f test/manifest-compat.test.mjs ]; then
            node --test test/manifest-compat.test.mjs
          fi

      # 幂等：版本已在 npmjs 上就跳过。这样"先本地发、后补 tag"不会把 run 打红，
      # 重跑同一个 tag 也是 no-op 而不是失败（LESSONS §42）。
      - name: Publish to npmjs (idempotent — skips an already-published version)
        shell: bash
        run: |
          set -uo pipefail
          VER="$(node -p "require('./package.json').version")"
          PKG='@yanglaofish/dsh-skill-manager'
          echo "manifest version = ${VER}"
          if npm view "${PKG}@${VER}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "version ${VER} is already on npmjs — skipping publish (a re-run is a no-op, not a failure)"
            exit 0
          fi

          # npm 拒绝给"低于当前 latest"的版本**隐式**打 latest：
          #   Cannot implicitly apply the "latest" tag because previously published
          #   version 4.3.5 is higher than the new version 2.0.1.
          # 而本插件的版本号是「代际对齐」的（2.x 服务 dsh 0.2.x，数字上低于旧的 4.x 线），
          # 所以必须**显式**指定 tag：
          #   * 当前世代（major >= 2）必须接管 latest —— 否则 `npm i <pkg>` 仍会装到旧的
          #     4.x 代码（4.3.5 是坏的那一版）。显式 --tag latest 不做高低检查。
          #   * 历史世代线（major = 1，服务 dsh 0.1.x）数字同样更低，但它不该抢 latest，
          #     发到自己的 `v1` tag 即可 —— `npm i <pkg>@1` 依然可用。
          MAJOR="${VER%%.*}"
          if [ "$MAJOR" = "1" ]; then
            PRIMARY_TAG="v1"
          else
            PRIMARY_TAG="latest"
          fi
          echo "publishing ${VER} with --tag ${PRIMARY_TAG}"

          STATUS=0
          npm publish --registry=https://registry.npmjs.org --access=public --tag "${PRIMARY_TAG}" > /tmp/pub.log 2>&1 || STATUS=$?
          if [ "$STATUS" != "0" ] && [ "$PRIMARY_TAG" = "latest" ]; then
            # 兜底：万一连显式 --tag latest 也被拒，就先发到临时 tag 再把 latest 指过去。
            echo "explicit --tag latest was refused — retrying via a temporary tag, then moving latest"
            tail -5 /tmp/pub.log
            STATUS=0
            npm publish --registry=https://registry.npmjs.org --access=public --tag pending > /tmp/pub.log 2>&1 || STATUS=$?
            if [ "$STATUS" = "0" ]; then
              npm dist-tag add "${PKG}@${VER}" latest >> /tmp/pub.log 2>&1 || STATUS=$?
            fi
          fi
          echo "npm publish exit=${STATUS}"
          tail -30 /tmp/pub.log
          if [ "$STATUS" != "0" ]; then
            node -e '
              const fs = require("node:fs");
              let text = "";
              try { text = fs.readFileSync("/tmp/pub.log", "utf8") } catch {}
              const tail = String(text).split("\n").slice(-25).join("\n");
              console.log("::error title=npm publish failed::" + tail.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A"));
            '
            exit 1
          fi
          echo "::notice title=npm publish::published ${VER} to npmjs with tag ${PRIMARY_TAG}"
          npm view "${PKG}" dist-tags --registry=https://registry.npmjs.org || true

      # 用户铁律（dsh-proxy-pro LESSONS §28）：publish 成功后不许干等，必须主动循环
      # 触发淘宝源同步，直到 npmmirror 的 dist-tags.latest 等于本次版本。
      #
      # 两个已踩过的坑：
      #  1) 端点：npmmirror 的同步 API 用 QUERY 参数收包名 ——
      #     `PUT /-/sync?name=%40scope%2Fname` 返回 201；路径式
      #     `PUT /-/sync/@scope%2Fname` 返回 404（LESSONS §34）。旧写法被 `|| true`
      #     吞掉，看起来"同步过了"，其实一直靠懒同步兜底。
      #  2) 只 PUT 一次不够：PUT 返回 201 只是入队确认，不等于同步完成。实测要
      #     11~33 轮（2~4 分钟）才拉到，所以这里每轮先重发再轮询（LESSONS §28）。
      - name: Taobao mirror — active sync + poll dist-tags.latest
        shell: bash
        run: |
          set -uo pipefail
          REF="${GITHUB_REF_NAME:-}"
          VER="${REF#v}"
          ENC='%40yanglaofish%2Fdsh-skill-manager'
          echo "target=${VER}"
          LATEST=''
          for i in $(seq 1 60); do
            curl -sS -X PUT "https://registry.npmmirror.com/-/sync?name=${ENC}" \
              -H 'content-type: application/json' -d "{\"version\":\"${VER}\"}" \
              -o /tmp/sync.json -w "trigger ${i}: http=%{http_code}\n" || true
            LATEST=$(curl -sS "https://registry.npmmirror.com/${ENC}" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d)['dist-tags']?.latest||'')}catch{console.log('')}})" 2>/dev/null || echo '')
            echo "poll ${i}: tb latest=${LATEST} (want ${VER})"
            if [ "${LATEST}" = "${VER}" ]; then
              echo "SYNCED: ${LATEST}"
              exit 0
            fi
            sleep 8
          done
          echo "::error::淘宝源 8 分钟内没同步到 ${VER}。若 npmjs 侧走的是 staged publishing（202），请先在 npmjs 网页做 2FA 批准或用 npm stage approve，然后重跑本 job。"
          exit 1

      - name: Report dist-tags afterwards
        if: always()
        shell: bash
        run: npm view '@yanglaofish/dsh-skill-manager' dist-tags versions --json 2>&1 | tail -40 || true
